services:
  mysql:
    image: mysql:8.4.8
    command: ["--default-time-zone=+00:00", "--transaction-isolation=READ-COMMITTED", "--innodb-flush-log-at-trx-commit=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: javame
      MYSQL_USER: javame
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql --protocol=TCP -h 127.0.0.1 -u \"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: javame
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/javame?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DATABASE_USER: javame
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      RABBITMQ_URI: amqp://javame:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/
      JAVAME_API_KEY: ${JAVAME_API_KEY:?Set JAVAME_API_KEY}
      HTTP_HOST: 0.0.0.0
      GRPC_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${GRPC_PORT:-8088}:8088"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 30s
volumes:
  mysql-data:
  rabbit-data:
